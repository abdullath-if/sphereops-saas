version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sphereops_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/company_saas
      - JWT_SECRET=production_enterprise_secret_jwt_sphereops_998877
      - JWT_EXPIRE=7d
      - CLIENT_URL=*
      - UPLOAD_DIR=uploads
    depends_on:
      - mongo
    volumes:
      - sphereops_uploads:/app/server/uploads

  mongo:
    image: mongo:6.0
    container_name: sphereops_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - sphereops_mongodb_data:/data/db

volumes:
  sphereops_mongodb_data:
  sphereops_uploads:
